<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Create Post | Mini Farms USA</title>
		<link rel="stylesheet" href="/css/common.css" />
		<link rel="stylesheet" href="/css/create-post.css" />
	</head>
	<body>
		<!-- ================= TOP NAVIGATION ================= -->
		<header class="navbar">
			<div class="navbar-logo">
				<div class="navbar-logo-placeholder">MF</div>
				<span class="navbar-logo-text">Mini Farms USA</span>
			</div>
			<nav class="navbar-links">
				<ul>
					<li><a href="/index.html">Home</a></li>
					<li><a href="/about.html">About Us</a></li>
					<li><a href="/blog.html">Blog</a></li>
					<li><a href="/contact.html">Contact Us</a></li>
				</ul>
			</nav>
		</header>

		<!-- ================= POST FORM ================= -->
		<section class="section-padding">
			<div class="container">
				<h1>Create a Blog Post</h1>
				<p class="form-intro">
					Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do
					eiusmod tempor incididunt ut labore et dolore magna aliqua.
				</p>

				<form action="/post/submit" method="POST" class="post-form">
					<div class="form-group">
						<label for="imgLink">Image Link</label>
						<input
							type="url"
							id="imgLink"
							name="imgLink"
							required
							placeholder="https://example.com/images/post.jpg"
						/>
					</div>

					<div class="form-group">
						<label for="title">Title</label>
						<input
							type="text"
							id="title"
							name="title"
							placeholder="Post title"
						/>
					</div>

					<div class="form-group">
						<label for="category">Category</label>
						<input
							type="text"
							id="category"
							name="category"
							required
							placeholder="e.g. Farm Updates, Community"
						/>
					</div>

					<div class="form-group">
						<label for="author">Author</label>
						<input
							type="text"
							id="author"
							name="author"
							required
							placeholder="e.g. Jane Smith"
						/>
					</div>

					<div class="form-group">
						<label for="date">Date</label>
						<input
							type="date"
							id="date"
							name="date"
							required
						/>
					</div>

					<div class="form-group">
						<label for="content">Content</label>
						<textarea
							id="content"
							name="content"
							required
							rows="16"
							placeholder="Write your post content here."
						></textarea>
					</div>

					<button type="submit" class="btn btn-primary">Publish Post</button>
				</form>
			</div>
		</section>

		<!-- ================= FOOTER ================= -->
		<footer class="site-footer">
			<div class="footer-content">
				<p class="footer-copyright">
					&copy; 2026 Mini Farms USA. All rights reserved.
				</p>
				<nav class="footer-links">
					<ul>
						<li><a href="/index.html">Home</a></li>
						<li><a href="/about.html">About Us</a></li>
						<li><a href="/blog.html">Blog</a></li>
						<li><a href="/contact.html">Contact Us</a></li>
					</ul>
				</nav>
			</div>
		</footer>
	</body>
</html>
